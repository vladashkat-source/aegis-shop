<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Aegis Shop — предмети Dota 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site">
 
    <header class="head">
        <a class="logo" href="#"><img src="logo.png" alt="Aegis Shop"></a>
        <nav><a href="#catalog">Каталог</a><a href="#inv">Інвентар<b id="cnt">0</b></a></nav>
    </header>
 
    <main>
        <div class="cart-list">
            <div class="product">
                <div class="product-img">
                    <img src="https://placehold.co/100" alt="">
                </div>
                <div class="product-title">
                    <h3>title</h3>
                </div>
                <div class="quantity-control">
                    <button class="quantity-minus">-</button>
                    <span class="quantity">0</span>
                    <button class="quantity-plus">+</button>
                </div>
                <div class="remove">
                    <button class="remove-btn">X</button>
                </div>
            </div>
        </div>

    </main>
 
    <footer>
        
    </footer>
</div>
 
<script src="script.js"></script>
</body>
</html>
